<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookkeeping Workbook</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  --xl-green:#217346;
  --xl-green-dark:#185C37;
  --xl-bg:#F3F3F3;
  --xl-border:#D4D4D4;
  --xl-tab-h:34px;
  --font:'Segoe UI',system-ui,-apple-system,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--xl-bg);color:#222;display:flex;flex-direction:column}

/* ---------- Title bar ---------- */
.titlebar{height:36px;background:var(--xl-green);color:#fff;display:flex;align-items:center;gap:12px;padding:0 14px;flex-shrink:0;font-size:13px}
.titlebar .app-icon{width:20px;height:20px;background:#fff;color:var(--xl-green);border-radius:3px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.titlebar .doc-title{font-weight:600}
.titlebar .spacer{flex:1}
.titlebar .tb-btn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:4px;padding:4px 10px;font-size:12px;cursor:pointer;font-family:var(--font);display:flex;align-items:center;gap:6px;text-decoration:none}
.titlebar .tb-btn:hover{background:rgba(255,255,255,.26)}

/* ---------- Formula bar (name box shows the active sheet's file) ---------- */
.formulabar{height:32px;background:#fff;border-bottom:1px solid var(--xl-border);display:flex;align-items:center;gap:8px;padding:0 10px;flex-shrink:0;font-size:12px}
.namebox{width:150px;border:1px solid var(--xl-border);border-radius:3px;padding:3px 8px;background:#fff;color:#333;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx{color:#666;font-style:italic;font-weight:700;padding:0 4px;border-left:1px solid var(--xl-border);border-right:1px solid var(--xl-border)}
.formula-text{flex:1;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Sheet area ---------- */
.sheet-area{flex:1;position:relative;background:#fff;min-height:0}
.sheet-frame{position:absolute;inset:0;width:100%;height:100%;border:none;background:#fff;display:none}
.sheet-frame.active{display:block}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;color:#777;font-size:14px;background:#fff;z-index:2;pointer-events:none;transition:opacity .2s}
.loading.hidden{opacity:0}
.spinner{width:18px;height:18px;border:3px solid #ddd;border-top-color:var(--xl-green);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Sheet tab bar (bottom) ---------- */
.tabbar{height:var(--xl-tab-h);background:#EDEDED;border-top:1px solid var(--xl-border);display:flex;align-items:stretch;flex-shrink:0;user-select:none}
.tab-nav{display:flex;align-items:center;padding:0 4px;gap:2px;border-right:1px solid var(--xl-border)}
.tab-nav button{width:26px;height:26px;border:none;background:none;color:#555;cursor:pointer;border-radius:3px;font-size:11px}
.tab-nav button:hover:not(:disabled){background:#dcdcdc}
.tab-nav button:disabled{opacity:.35;cursor:default}
.tabs{display:flex;align-items:stretch;overflow-x:auto;overflow-y:hidden;flex:1;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;display:flex;align-items:center;gap:7px;padding:0 20px;font-size:13px;color:#444;cursor:pointer;white-space:nowrap;border-right:1px solid #D0D0D0;background:transparent;border-top:2px solid transparent;transition:background .12s}
.tab:hover{background:#E0E0E0}
.tab .dot{width:8px;height:8px;border-radius:2px;background:var(--tab-color,#999);flex-shrink:0}
.tab.active{background:#fff;color:var(--xl-green-dark);font-weight:700;border-top:2px solid #fff;box-shadow:inset 0 -3px 0 var(--xl-green)}
.tab.active .dot{box-shadow:0 0 0 2px rgba(33,115,70,.2)}
.tab-end{display:flex;align-items:center;padding:0 10px;color:#777;font-size:12px;gap:14px;border-left:1px solid var(--xl-border)}

/* ---------- Status bar ---------- */
.statusbar{height:22px;background:var(--xl-green);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:11px;flex-shrink:0}
.statusbar .left,.statusbar .right{display:flex;align-items:center;gap:14px}
.status-dot{width:7px;height:7px;border-radius:50%;background:#9AF0B5;display:inline-block;margin-right:5px}

</style>
</head>
<body>

<div class="titlebar">
  <div class="app-icon">X</div>
  <div class="doc-title">Bookkeeping Workbook</div>
  <div class="spacer"></div>
  <button class="tb-btn" id="reloadBtn" title="Reload this sheet"><i class="fas fa-rotate"></i> Reload Sheet</button>
  <a class="tb-btn" id="dbBtn" href="#" target="_blank" rel="noopener" title="Open the Google Sheet that stores your data"><i class="fas fa-table"></i> Data Sheet</a>
</div>

<div class="formulabar">
  <div class="namebox" id="nameBox">—</div>
  <div class="fx">fx</div>
  <div class="formula-text" id="formulaText"></div>
</div>

<div class="sheet-area" id="sheetArea">
  <div class="loading" id="loading"><div class="spinner"></div><span>Loading sheet…</span></div>
</div>

<div class="tabbar">
  <div class="tab-nav">
    <button id="prevTab" title="Previous sheet (Ctrl+PageUp)"><i class="fas fa-chevron-left"></i></button>
    <button id="nextTab" title="Next sheet (Ctrl+PageDown)"><i class="fas fa-chevron-right"></i></button>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="tab-end"><span id="sheetCounter">Sheet 1 of 1</span></div>
</div>

<div class="statusbar">
  <div class="left"><span><span class="status-dot"></span><span id="statusText">Ready</span></span></div>
  <div class="right"><span id="statusSheet"></span></div>
</div>

<script>
/* ============================================================
   SHEETS — ids must match the PAGES list in Code.gs.
============================================================ */
var SHEETS = [
  { id:'journal',      name:'JOURNAL ENTRY',      color:'#7C3AED' },
  { id:'sales',        name:'VATABLE SALES',      color:'#2563EB' },
  { id:'purchases',    name:'VATABLE PURCHASES',  color:'#16A34A' },
  { id:'expenses',     name:'VATABLE EXPENSES',   color:'#F59E0B' },
  { id:'nonvat',       name:'NON VAT PURCHASES',  color:'#EF4444' },
  { id:'nonvatexp',    name:'NON VAT EXPENSES',   color:'#EC4899' },
  { id:'returns',      name:'PURCHASE RETURNS',   color:'#14B8A6' },
  { id:'taxes',        name:'TAXES & LICENSES',   color:'#0EA5E9' },
  { id:'capex',        name:'CAPEX',              color:'#06B6D4' },
  { id:'compensation', name:'COMPENSATION',       color:'#84CC16' }
];
var INITIAL = <?!= JSON.stringify(initialSheet || '') ?>;

/* default session — shared by every sheet (same origin) */
try {
  var _s = null; try { _s = JSON.parse(sessionStorage.getItem('VAT_SESSION') || 'null'); } catch (e) {}
  if (!_s || !_s.id) sessionStorage.setItem('VAT_SESSION', JSON.stringify({ id:'workbook-user', username:'Workbook', role:'Main', token:'gas-session', _token:'gas-session' }));
} catch (e) {}

var tabsEl = document.getElementById('tabs');
var areaEl = document.getElementById('sheetArea');
var loadEl = document.getElementById('loading');
var frames = {};      // id -> iframe (kept alive so each sheet keeps its state)
var htmlCache = {};   // id -> rendered HTML from the server
var activeId = null;

function run() { return google.script.run; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function setStatus(t) { document.getElementById('statusText').textContent = t; }

/* ---------- build tabs ---------- */
SHEETS.forEach(function (s) {
  var t = document.createElement('div');
  t.className = 'tab';
  t.dataset.id = s.id;
  t.style.setProperty('--tab-color', s.color);
  t.innerHTML = '<span class="dot"></span><span>' + esc(s.name) + '</span>';
  t.addEventListener('click', function () { activate(s.id); });
  tabsEl.appendChild(t);
});

/* ---------- load a sheet's HTML from Apps Script into its iframe ---------- */
function loadFrame(s, force) {
  var f = frames[s.id];
  if (!f) {
    f = document.createElement('iframe');
    f.className = 'sheet-frame';
    f.title = s.name;
    f.dataset.id = s.id;
    f.addEventListener('load', function () { f.dataset.loaded = '1'; if (activeId === s.id) loadEl.classList.add('hidden'); });
    areaEl.appendChild(f);
    frames[s.id] = f;
  }
  function paint(html) { f.dataset.loaded = ''; f.srcdoc = html + '\n<!-- ' + Date.now() + ' -->'; }
  if (htmlCache[s.id] && !force) { if (!f.srcdoc) paint(htmlCache[s.id]); return f; }
  if (activeId === s.id) loadEl.classList.remove('hidden');
  setStatus('Loading ' + s.name + '…');
  run().withSuccessHandler(function (html) {
    htmlCache[s.id] = html; paint(html); setStatus('Ready');
  }).withFailureHandler(function (e) {
    setStatus('Error');
    loadEl.classList.add('hidden');
    f.srcdoc = '<body style="font-family:Segoe UI,sans-serif"><div class="err" style="color:#b91c1c;padding:30px;text-align:center">Could not load this sheet.<br><small>' + esc(e && e.message || e) + '</small></div></body>';
  }).getPageHtml(s.id);
  return f;
}

/* ---------- activate a sheet ---------- */
function activate(id, opts) {
  var s = SHEETS.filter(function (x) { return x.id === id; })[0] || SHEETS[0];
  activeId = s.id;

  var f = loadFrame(s, false);
  Object.keys(frames).forEach(function (k) { frames[k].classList.toggle('active', frames[k] === f); });
  loadEl.classList.toggle('hidden', f.dataset.loaded === '1');

  document.querySelectorAll('.tab').forEach(function (t) { t.classList.toggle('active', t.dataset.id === s.id); });
  var idx = SHEETS.indexOf(s);
  document.getElementById('prevTab').disabled = idx === 0;
  document.getElementById('nextTab').disabled = idx === SHEETS.length - 1;
  document.getElementById('sheetCounter').textContent = 'Sheet ' + (idx + 1) + ' of ' + SHEETS.length;
  document.getElementById('nameBox').textContent = s.name;
  document.getElementById('formulaText').textContent = s.id;
  document.getElementById('statusSheet').textContent = s.name;
  document.title = s.name + ' — Bookkeeping Workbook';

  var activeTab = tabsEl.querySelector('.tab.active');
  if (activeTab) activeTab.scrollIntoView({ block:'nearest', inline:'nearest' });
  try { if (!opts || !opts.noHash) history.replaceState(null, '', '#' + s.id); } catch (e) {}
}

function step(d) {
  var i = SHEETS.findIndex(function (s) { return s.id === activeId; }) + d;
  if (i >= 0 && i < SHEETS.length) activate(SHEETS[i].id);
}

document.getElementById('prevTab').addEventListener('click', function () { step(-1); });
document.getElementById('nextTab').addEventListener('click', function () { step(1); });
document.getElementById('reloadBtn').addEventListener('click', function () {
  var s = SHEETS.filter(function (x) { return x.id === activeId; })[0];
  if (s) { loadEl.classList.remove('hidden'); loadFrame(s, true); }
});
document.addEventListener('keydown', function (e) {
  if (e.ctrlKey && e.key === 'PageDown') { e.preventDefault(); step(1); }
  if (e.ctrlKey && e.key === 'PageUp')   { e.preventDefault(); step(-1); }
});
window.addEventListener('hashchange', function () {
  var id = location.hash.slice(1);
  if (id && id !== activeId) activate(id, { noHash:true });
});

/* ---------- database link ---------- */
run().withSuccessHandler(function (info) {
  var a = document.getElementById('dbBtn');
  if (info && info.url) a.href = info.url; else a.style.display = 'none';
}).withFailureHandler(function () { document.getElementById('dbBtn').style.display = 'none'; }).getWorkbookInfo();

/* ---------- start ---------- */
activate((INITIAL || location.hash.slice(1)) || SHEETS[0].id);
</script>
</body>
</html>
