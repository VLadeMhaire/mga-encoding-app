<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>VAT Tracking System - Professional Welcome</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Professional Gradient Background */
        .welcome-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0e27 0%, #0d1f5c 50%, #1a3ba0 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        /* Animated geometric patterns */
        .pattern-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                repeating-linear-gradient(45deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 2px, transparent 2px, transparent 8px),
                repeating-linear-gradient(135deg, rgba(100,160,255,0.02) 0px, rgba(100,160,255,0.02) 3px, transparent 3px, transparent 12px);
            pointer-events: none;
            z-index: 1;
        }
        
        /* Floating particles */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 2;
        }
        
        .particle {
            position: absolute;
            background: rgba(100, 160, 255, 0.3);
            border-radius: 50%;
            pointer-events: none;
            animation: floatParticle linear infinite;
        }
        
        @keyframes floatParticle {
            0% {
                transform: translateY(100vh) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.5;
            }
            90% {
                opacity: 0.3;
            }
            100% {
                transform: translateY(-100vh) translateX(100px) rotate(360deg);
                opacity: 0;
            }
        }
        
        /* Glowing orb effects */
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            pointer-events: none;
            z-index: 1;
        }
        
        .orb-1 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(30,136,229,0.5), transparent);
            top: -150px;
            right: -100px;
            animation: orbFloat 15s ease-in-out infinite;
        }
        
        .orb-2 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(229,57,53,0.3), transparent);
            bottom: -200px;
            left: -150px;
            animation: orbFloat 20s ease-in-out infinite reverse;
        }
        
        .orb-3 {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(13,138,110,0.4), transparent);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: orbPulse 8s ease-in-out infinite;
        }
        
        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, 30px); }
        }
        
        @keyframes orbPulse {
            0%, 100% { opacity: 0.2; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.4; transform: translate(-50%, -50%) scale(1.2); }
        }
        
        /* Main content */
        .welcome-content {
            text-align: center;
            animation: contentReveal 0.9s cubic-bezier(0.16, 1, 0.3, 1);
            max-width: 85vw;
            padding: 2rem;
            position: relative;
            z-index: 10;
        }
        
        @keyframes contentReveal {
            0% {
                transform: scale(0.9) translateY(30px);
                opacity: 0;
                filter: blur(10px);
            }
            100% {
                transform: scale(1) translateY(0);
                opacity: 1;
                filter: blur(0);
            }
        }
        
        /* Logo container */
        .logo-container {
            width: min(200px, 40vw);
            margin: 0 auto 30px auto;
            position: relative;
        }
        
        .logo-ring {
            position: absolute;
            inset: -15px;
            border-radius: 50%;
            border: 2px solid rgba(100, 160, 255, 0.3);
            animation: ringPulse 2s ease-in-out infinite;
        }
        
        .logo-ring-2 {
            position: absolute;
            inset: -30px;
            border-radius: 50%;
            border: 1px solid rgba(229, 57, 53, 0.2);
            animation: ringPulse 2.5s ease-in-out infinite reverse;
        }
        
        @keyframes ringPulse {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.05); opacity: 0.6; }
        }
        
        .welcome-logo {
            position: relative;
            filter: drop-shadow(0 0 30px rgba(30,136,229,0.6));
            transition: all 0.3s ease;
        }
        
        .welcome-logo img {
            width: 100%;
            border-radius: 40px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            padding: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.3s ease;
        }
        
        .welcome-logo:hover img {
            transform: scale(1.02);
        }
        
        /* Title styling - professional gradient */
        .welcome-title {
            font-family: 'Syne', sans-serif;
            font-size: clamp(2rem, 8vw, 4rem);
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, #93c5fd 40%, #60a5fa 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 16px;
            letter-spacing: -0.02em;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }
        
        .welcome-sub {
            font-size: clamp(0.9rem, 3.5vw, 1.2rem);
            font-weight: 500;
            color: rgba(255,255,255,0.7);
            margin-bottom: 40px;
            letter-spacing: 0.3px;
            background: rgba(255,255,255,0.05);
            display: inline-block;
            padding: 8px 24px;
            border-radius: 60px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        /* Feature badges */
        .feature-badges {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }
        
        .badge {
            padding: 6px 18px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 500;
            color: rgba(255,255,255,0.8);
            letter-spacing: 0.5px;
            backdrop-filter: blur(5px);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .badge i {
            font-size: 0.7rem;
            color: #60a5fa;
        }
        
        /* Professional CTA Button */
        .start-button {
            background: linear-gradient(135deg, #1a47cc 0%, #e53935 100%);
            border: none;
            padding: 16px 52px;
            font-size: 1.1rem;
            font-weight: 700;
            font-family: 'Syne', sans-serif;
            color: white;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }
        
        .start-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s ease;
        }
        
        .start-button:hover::before {
            left: 100%;
        }
        
        .start-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 30px rgba(229,57,53,0.5);
            letter-spacing: 2px;
        }
        
        .start-button i {
            font-size: 1rem;
            transition: transform 0.3s ease;
        }
        
        .start-button:hover i {
            transform: translateX(5px);
        }
        
        /* Audio hint - professional */
        .audio-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.7rem;
            color: rgba(255,255,255,0.4);
            z-index: 15;
            pointer-events: none;
            white-space: nowrap;
            background: rgba(0,0,0,0.3);
            padding: 5px 15px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
        }
        
        .audio-hint i {
            margin-right: 5px;
        }
        
        /* Loading spinner - professional */
        .loading-spinner {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10,14,39,0.95);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }
        
        .loading-spinner.active {
            opacity: 1;
            visibility: visible;
        }
        
        .spinner-content {
            text-align: center;
        }
        
        .spinner-circle {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(30,136,229,0.2);
            border-top: 3px solid #1a47cc;
            border-right: 3px solid #e53935;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .spinner-text {
            color: white;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 1px;
            font-family: 'DM Sans', sans-serif;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .feature-badges {
                gap: 10px;
            }
            .badge {
                padding: 4px 12px;
                font-size: 0.65rem;
            }
            .start-button {
                padding: 12px 40px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="welcome-overlay" id="welcomeOverlay">
        <!-- Animated pattern background -->
        <div class="pattern-bg"></div>
        
        <!-- Floating particles -->
        <div class="particles" id="particles"></div>
        
        <!-- Glowing orbs -->
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="glow-orb orb-3"></div>
        
        <div class="welcome-content">
            <div class="logo-container">
                <div class="logo-ring"></div>
                <div class="logo-ring-2"></div>
                <div class="welcome-logo">
                    <img src="MGAALogo.jpg" alt="MGAA Logo" onerror="this.src='https://placehold.co/200x200/1a47cc/white?text=MGAA'">
                </div>
            </div>
            <div class="welcome-title">VAT TRACKING SYSTEM</div>
            <div class="welcome-sub">Professional Kiosk Dashboard • Smart VAT Compliance</div>
            
            <div class="feature-badges">
                <span class="badge"><i class="fas fa-chart-line"></i> Real-time Tracking</span>
                <span class="badge"><i class="fas fa-shield-alt"></i> BIR Compliant</span>
                <span class="badge"><i class="fas fa-cloud-upload-alt"></i> Auto-save</span>
                <span class="badge"><i class="fas fa-lock"></i> Secure</span>
            </div>
            
            <button class="start-button" id="startButton">
                OPEN DASHBOARD <i class="fas fa-arrow-right"></i>
            </button>
        </div>
        <div class="audio-hint"><i class="fas fa-music"></i> startup music</div>
    </div>
    
    <div class="loading-spinner" id="loadingSpinner">
        <div class="spinner-content">
            <div class="spinner-circle"></div>
            <div class="spinner-text">Launching Dashboard...</div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // ========== CREATE FLOATING PARTICLES ==========
            const particlesContainer = document.getElementById('particles');
            
            function createParticles() {
                const particleCount = 50;
                for (let i = 0; i < particleCount; i++) {
                    const particle = document.createElement('div');
                    particle.classList.add('particle');
                    const size = Math.random() * 4 + 1;
                    particle.style.width = size + 'px';
                    particle.style.height = size + 'px';
                    particle.style.left = Math.random() * 100 + '%';
                    particle.style.animationDuration = Math.random() * 15 + 8 + 's';
                    particle.style.animationDelay = Math.random() * 10 + 's';
                    particle.style.opacity = Math.random() * 0.5 + 0.1;
                    particlesContainer.appendChild(particle);
                }
            }
            
            createParticles();
            
            // ========== MUSIC PLAYER FOR startup.mp3 ==========
let audioPlayer = null;
let musicStarted = false;

function playElevatorMusic() {
    if (musicStarted) return;
    
    if (audioPlayer) {
        audioPlayer.play().catch(e => {
            console.log("Autoplay prevented - waiting for user interaction");
        });
        return;
    }
    
    audioPlayer = new Audio('startup.mp3');
    audioPlayer.loop = false;
    audioPlayer.volume = 0.3;
    
    // Don't play immediately - wait for button click to start
    musicStarted = true;
}

function redirectToDashboard() {
    // Save music state BEFORE playing
    if (audioPlayer) {
        // Store the current time (0 since not started yet)
        sessionStorage.setItem('musicPlaying', 'true');
        sessionStorage.setItem('musicCurrentTime', '0');
        sessionStorage.setItem('musicTimestamp', Date.now().toString());
    } else {
        sessionStorage.setItem('musicPlaying', 'false');
    }
    
    // Show loading spinner
    loadingSpinner.classList.add('active');
    
    // Fade out welcome content
    const welcomeContent = document.querySelector('.welcome-content');
    if (welcomeContent) {
        welcomeContent.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
        welcomeContent.style.opacity = '0';
        welcomeContent.style.transform = 'scale(0.95)';
    }
    
    // Redirect immediately without playing music here
    setTimeout(() => {
        window.location.href = 'index2.html';
    }, 600);
}

if (startButton) {
    startButton.addEventListener('click', function() {
        // Create audio but don't play it yet
        if (!audioPlayer) {
            audioPlayer = new Audio('startup.mp3');
            audioPlayer.loop = false;
            audioPlayer.volume = 0.3;
            musicStarted = true;
        }
        redirectToDashboard();
    });
}
        });
    </script>
</body>
</html>
